<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belgische Gemeente Guessr</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header class="head">
      <h1>Belgische Gemeente <em>Guessr</em></h1>
      <p class="sub" id="dataInfo">gemeentegrenzen laden…</p>
    </header>

    <nav class="modes">
      <button type="button" class="mode is-active" data-mode="quiz">Quiz</button>
      <button type="button" class="mode" data-mode="learn">Leren</button>
    </nav>

    <div class="controls">
      <label class="field">
        <span>Gebied</span>
        <select id="area"></select>
      </label>
      <label class="field">
        <span>Taal</span>
        <select id="lang">
          <option value="nl" selected>Nederlands</option>
          <option value="fr">Frans</option>
          <option value="de">Duits</option>
        </select>
      </label>

      <label class="field">
        <span>Achtergrondkaart</span>
        <select id="basemap">
          <option value="osm" selected>OpenStreetMap</option>
          <option value="plain">OpenStreetMap zonder namen</option>
        </select>
      </label>
      <p class="muted" id="basemapNote"></p>
    </div>

    <section id="quizPanel">
      <div class="prompt">
        <span class="prompt-label">Duid aan op de kaart</span>
        <strong id="target">—</strong>
        <div class="attempts" id="attempts" title="Pogingen"></div>
      </div>

      <div class="stats">
        <div class="stat"><b id="statLeft">0</b><span>te gaan</span></div>
        <div class="stat is-ok"><b id="statCorrect">0</b><span>juist</span></div>
        <div class="stat is-bad"><b id="statWrong">0</b><span>fout</span></div>
      </div>

      <div class="progress"><i id="progressBar"></i></div>
      <p class="muted" id="misclicks">&nbsp;</p>

      <div class="actions">
        <button type="button" class="btn" id="skip">Overslaan</button>
        <button type="button" class="btn is-ghost" id="restart">Opnieuw</button>
      </div>

      <div class="done" id="done" hidden></div>
    </section>

    <section id="learnPanel" hidden>
      <p class="hint">Klik op eender welke gemeente op de kaart om haar naam te zien.</p>
      <div class="learn-card" id="learnCard" hidden>
        <strong id="learnName">—</strong>
        <dl id="learnMeta"></dl>
      </div>
    </section>

    <footer class="foot">
      <p>Grenzen: <span id="sourceName">Statbel</span> — achtergrondkaart © OpenStreetMap-bijdragers.</p>
    </footer>
  </aside>

  <div id="map"></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/leaflet-maplibre-gl.js"></script>
<script src="data/gemeenten.js"></script>
<script src="app.js"></script>
</body>
</html>
